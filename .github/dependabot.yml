# Monthly grouped dependency bumps: one PR for GitHub Actions, one for the client packages.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /src/client
    schedule:
      interval: monthly
    groups:
      client:
        patterns:
          - "*"
